- name: Install PostgreSQL client library on macOS
  if: runner.os == 'macOS'
  shell: bash
  run: |
    brew install libpq
    echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> "$GITHUB_ENV"

- name: Install PostgreSQL client library on Windows
  if: runner.os == 'Windows'
  shell: pwsh
  run: |
    $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
    & "$env:VCPKG_ROOT\vcpkg.exe" install libpq:x64-windows
    "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
    "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
