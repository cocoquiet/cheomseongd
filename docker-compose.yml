services:
  postgres:
    image: postgres:17

    container_name: cheomseongd_postgres

    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cheomseongd

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres_data:
