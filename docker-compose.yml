services:
  postgres:
    image: postgres:17

    container_name: cheomseongd_postgres

    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cheomseongd

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d cheomseongd
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/cheomseongd
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start"]

volumes:
  postgres_data:
